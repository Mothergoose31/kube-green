# This rule is not used by the project kube-green itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the kube-green.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kube-green
    app.kubernetes.io/managed-by: kustomize
  name: sleepinfoexecution-editor-role
rules:
- apiGroups:
  - kube-green.com
  resources:
  - sleepinfoexecutions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kube-green.com
  resources:
  - sleepinfoexecutions/status
  verbs:
  - get
